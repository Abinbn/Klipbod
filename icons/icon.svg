<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Klipbod">
  <defs>
    <linearGradient id="board" x1="18" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect width="128" height="128" rx="28" fill="url(#board)" />

  <!-- Clipboard body -->
  <rect x="36" y="30" width="56" height="72" rx="12" fill="#ffffff" />
  <rect x="36" y="30" width="56" height="72" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />

  <!-- Clip -->
  <rect x="48" y="21" width="32" height="19" rx="9.5" fill="#c7d2fe" />
  <rect x="55" y="26.5" width="18" height="8" rx="4" fill="#4338ca" />

  <!-- Lines of copied content -->
  <rect x="48" y="56" width="32" height="6" rx="3" fill="#4338ca" />
  <rect x="48" y="70" width="26" height="6" rx="3" fill="#6366f1" />
  <rect x="48" y="84" width="18" height="6" rx="3" fill="#a5b4fc" />
</svg>
